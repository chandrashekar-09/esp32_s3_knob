; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; default_envs = esp32-s3 ; Sets the default board to build for
default_envs = esp32dev 

[env:esp32dev]
platform = espressif32
board = esp32dev
monitor_speed = 115200
framework = espidf
board_build.flash_size = 4MB
board_build.partitions = partitions_ota_4mb.csv

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
monitor_speed = 115200
framework = espidf
; src_dir = src

; Force your host OS terminal emulator to drive the USB CDC communication line
monitor_dtr = 1
monitor_rts = 1
monitor_raw = yes

; Production memory layout
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.psram_size = 8MB
board_build.partitions = partitions_ota_16mb.csv
