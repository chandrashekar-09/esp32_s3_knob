; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3 ; Sets the default board to build for
; default_envs = esp32dev 

[env:esp32dev]
; Same version pins as esp32-s3 below. Without these, PIO repeatedly tries
; to download the latest framework-espidf, the install half-fails, and the
; broken `framework-espidf` folder (no package.json) gets left behind in
; ~/.platformio/packages. That's the source of the MissingPackageManifestError
; loop. Reusing the already-cached framework-espidf@3.50500.0 cuts the loop.
platform = espressif32 @ 6.10.0
platform_packages =
	framework-espidf @ 3.50500.0
	toolchain-xtensa-esp-elf @ 14.2.0+20241119
	toolchain-riscv32-esp @ 14.2.0+20241119
board = esp32dev
monitor_speed = 115200
framework = espidf
board_build.flash_size = 4MB
board_build.partitions = partitions_ota_4mb.csv
build_flags =
	-DLV_CONF_INCLUDE_SIMPLE
lib_deps =
	lvgl/lvgl@8.3.11

[env:esp32-s3]
; Pin to platform 6.10.0 + IDF 5.5.0. The newer espressif32 7.x ships with
; IDF 6.0.1 whosekconfgen crashes on this project's sdkconfig due to a
; deprecated-symbol/choice handling bug. Locking versions known to work.
platform = espressif32 @ 6.10.0
platform_packages =
    framework-espidf @ 3.50500.0
    toolchain-xtensa-esp-elf @ 14.2.0+20241119
    toolchain-riscv32-esp @ 14.2.0+20241119
board = esp32-s3-devkitc-1-n16r8
monitor_speed = 115200
framework = espidf
; src_dir = src

; Force your host OS terminal emulator to drive the USB CDC communication line
monitor_dtr = 1
monitor_rts = 1
monitor_raw = yes

; Production memory layout
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_ota_16mb.csv
build_flags =
	-DLV_CONF_INCLUDE_SIMPLE
lib_deps =
	lvgl/lvgl@8.3.11
